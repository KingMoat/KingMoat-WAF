name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck deploy scripts
        run: |
          shellcheck --version
          shellcheck deploy/install.sh scripts/build.sh
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build
        run: go build ./...
      - name: Build (release tags)
        run: go build -tags no_fs_access ./...
      - name: Vet
        run: go vet ./...
      - name: License compliance check
        run: go run ./scripts/gen-licenses -check
      - name: Test
        run: go test ./... -race -count=1
      - name: Test (release tags)
        run: go test -tags no_fs_access ./... -count=1

  docker:
    name: docker build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: kingmoat:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: release packages
    needs: [test, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build packages
        run: ./scripts/build.sh "${GITHUB_REF_NAME}"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kingmoat_${{ github.ref_name }}/*.zip
            dist/kingmoat_${{ github.ref_name }}/*.tar.gz
            dist/kingmoat_${{ github.ref_name }}/checksums.txt
          generate_release_notes: true
